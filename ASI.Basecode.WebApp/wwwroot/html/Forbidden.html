<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Access denied | HiRAM</title>
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            background: #f6f8fc;
            font-family: Inter, system-ui, "Segoe UI", sans-serif;
            color: #18223b;
        }

        .box {
            max-width: 420px;
            padding: 36px;
            text-align: center;
            background: #fff;
            border: 1px solid #e6eaf1;
            border-radius: 14px;
        }

        h1 {
            margin: 0 0 8px;
            font-size: 22px;
        }

        p {
            margin: 0 0 22px;
            color: #728097;
            font-size: 14px;
            line-height: 1.6;
        }

        a {
            display: inline-block;
            padding: 10px 18px;
            border-radius: 9px;
            background: #5b50df;
            color: #fff;
            font-weight: 700;
            font-size: 13px;
            text-decoration: none;
        }
    </style>
</head>
<body>
    <div class="box">
        <h1>Access denied</h1>
        <p>Your account does not have permission to open this page.</p>
        <a href="/Dashboard/Index">Back to dashboard</a>
    </div>
</body>
</html>
