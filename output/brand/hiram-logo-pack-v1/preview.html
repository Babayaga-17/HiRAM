am-mark-navy.svg" alt="navy symbol"><img class="stack" src="hiram-stacked-navy.svg" alt="navy stacked logo"></div></section><section class="tile dark"><h2>White</h2><img class="horizontal" src="hiram-horizontal-white.svg" alt="HiRAM white horizontal logo"><div class="variants"><img class="mark" src="hiram-mark-white.svg" alt="white symbol"><img class="stack" src="hiram-stacked-white.svg" alt="white stacked logo"></div></section></div><div class="small"><img src="hiram-mark-primary.svg" alt="Small mark"><img src="hiram-mark-navy.svg" alt="Small monochrome mark"><span>32 px mark check</span></div><footer>12 editable vector assets · Transparent backgrounds · Outlined lettering</footer></main></html>
